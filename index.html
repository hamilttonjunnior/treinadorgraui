<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Interativo</title>
  <style>
    /* ==========================================================================
       RESET & VARIÁVEIS DE CORES (Paleta Minimalista / Dark Mode)
       ========================================================================== */
    :root {
      --bg-primary: #0f172a;       /* Fundo principal (Cinza escuro/Slate) */
      --bg-surface: #1e293b;       /* Superfície dos cartões/paineis */
      --bg-surface-hover: #334155; /* Estado hover de itens */
      --border-color: #334155;     /* Bordas discretas */
      
      --text-main: #f8fafc;        /* Texto principal (Branco suave) */
      --text-muted: #94a3b8;       /* Texto secundário (Cinza médio) */
      
      --accent: #3b82f6;           /* Cor de destaque principal (Azul) */
      --accent-hover: #2563eb;     /* Destaque interativo */
      --danger: #ef4444;           /* Vermelho para ações críticas */
      --success: #10b981;          /* Verde para confirmações */

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --transition: all 0.2s ease-in-out;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ==========================================================================
       ESTRUTURA DE LAYOUT (Sidebar + Main Content)
       ========================================================================== */
    .app-container {
      display: flex;
      width: 100%;
      min-height: 100vh;
    }

    aside.sidebar {
      width: 260px;
      background-color: var(--bg-surface);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1rem;
      flex-shrink: 0;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .brand-icon {
      width: 12px;
      height: 12px;
      background-color: var(--accent);
      border-radius: 50%;
      display: inline-block;
    }

    .nav-menu {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .nav-item button {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      text-align: left;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .nav-item button:hover {
      background-color: var(--bg-surface-hover);
      color: var(--text-main);
    }

    .nav-item.active button {
      background-color: var(--accent);
      color: #ffffff;
    }

    main.content {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    .header h1 {
      font-size: 1.75rem;
      font-weight: 600;
    }

    /* ==========================================================================
       COMPONENTES & CARDS
       ========================================================================== */
    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      transition: var(--transition);
    }

    .card:hover {
      border-color: var(--accent);
    }

    .card-title {
      font-size: 0.875rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .card-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-main);
    }

    /* Formulários e Inputs */
    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    input[type="text"],
    input[type="email"],
    select,
    textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      background-color: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: var(--transition);
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    /* Botões */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: var(--transition);
      background-color: var(--accent);
      color: #ffffff;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background-color: var(--bg-surface-hover);
    }

    /* Tabelas */
    .table-container {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: rgba(0, 0, 0, 0.15);
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background-color: var(--bg-surface-hover);
    }

    /* Seções (Alternância por Tab) */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Responsividade */
    @media (max-width: 768px) {
      .app-container {
        flex-direction: column;
      }
      aside.sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--border-color);
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- BARRA LATERAL -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-icon"></span>
        <span>WORKSPACE</span>
      </div>
      <ul class="nav-menu">
        <li class="nav-item active">
          <button onclick="switchTab('dashboard', this)">Dashboard</button>
        </li>
        <li class="nav-item">
          <button onclick="switchTab('cadastros', this)">Cadastros</button>
        </li>
        <li class="nav-item">
          <button onclick="switchTab('configuracoes', this)">Configurações</button>
        </li>
      </ul>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="content">
      
      <!-- TAB: DASHBOARD -->
      <section id="dashboard" class="tab-content active">
        <header class="header">
          <h1>Visão Geral</h1>
          <button class="btn" onclick="atualizarMetricas()">Atualizar Dados</button>
        </header>

        <div class="grid-cards">
          <div class="card">
            <div class="card-title">Projetos Ativos</div>
            <div class="card-value" id="val-projetos">12</div>
          </div>
          <div class="card">
            <div class="card-title">Tarefas Concluídas</div>
            <div class="card-value" id="val-tarefas">148</div>
          </div>
          <div class="card">
            <div class="card-title">Eficiência Média</div>
            <div class="card-value" id="val-eficiencia">94%</div>
          </div>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Nome do Projeto</th>
                <th>Responsável</th>
                <th>Status</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="tabela-projetos">
              <tr>
                <td>Redesign de Interface</td>
                <td>Hamilton</td>
                <td><span style="color: var(--success);">Em Andamento</span></td>
                <td><button class="btn btn-secondary" onclick="detalhar('Redesign')">Ver</button></td>
              </tr>
              <tr>
                <td>Pipeline de VFX</td>
                <td>Cássia</td>
                <td><span style="color: var(--accent);">Planejamento</span></td>
                <td><button class="btn btn-secondary" onclick="detalhar('Pipeline')">Ver</button></td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- TAB: CADASTROS -->
      <section id="cadastros" class="tab-content">
        <header class="header">
          <h1>Novo Registro</h1>
        </header>

        <div class="card" style="max-width: 600px;">
          <form id="meuFormulario" onsubmit="salvarFormulario(event)">
            <div class="form-group">
              <label for="nome">Nome Completo</label>
              <input type="text" id="nome" placeholder="Digite o nome..." required>
            </div>

            <div class="form-group">
              <label for="categoria">Categoria</label>
              <select id="categoria">
                <option value="producao">Produção</option>
                <option value="pos-producao">Pós-Produção / VFX</option>
                <option value="desenvolvimento">Desenvolvimento</option>
              </select>
            </div>

            <div class="form-group">
              <label for="observacoes">Observações</label>
              <textarea id="observacoes" rows="4" placeholder="Detalhes adicionais..."></textarea>
            </div>

            <div style="display: flex; gap: 1rem;">
              <button type="submit" class="btn">Salvar Dados</button>
              <button type="reset" class="btn btn-secondary">Limpar</button>
            </div>
          </form>
        </div>
      </section>

      <!-- TAB: CONFIGURAÇÕES -->
      <section id="configuracoes" class="tab-content">
        <header class="header">
          <h1>Configurações do Sistema</h1>
        </header>
        
        <div class="card">
          <p style="color: var(--text-muted); margin-bottom: 1rem;">
            Ajustes e preferências gerais da aplicação.
          </p>
          <button class="btn btn-secondary" onclick="alert('Configurações salvas com sucesso!')">Salvar Preferências</button>
        </div>
      </section>

    </main>
  </div>

  <!-- ==========================================================================
     LOGICA JAVASCRIPT
     ========================================================================== -->
  <script>
    // Alternância de Abas (Navigation)
    function switchTab(tabId, element) {
      // Remove a classe active de todas as seções e botões
      document.querySelectorAll('.tab-content').forEach(tab => {
        tab.classList.remove('active');
      });
      document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.remove('active');
      });

      // Ativa a aba e o botão correspondente
      document.getElementById(tabId).classList.add('active');
      element.parentElement.classList.add('active');
    }

    // Função de simulação para atualizar métricas do Dashboard
    function atualizarMetricas() {
      const projetos = document.getElementById('val-projetos');
      const tarefas = document.getElementById('val-tarefas');
      
      projetos.innerText = Math.floor(Math.random() * 10) + 10;
      tarefas.innerText = Math.floor(Math.random() * 50) + 120;
    }

    // Simulação de submissão de formulário
    function salvarFormulario(event) {
      event.preventDefault();
      const nome = document.getElementById('nome').value;
      alert(`Registro de "${nome}" salvo com sucesso!`);
      document.getElementById('meuFormulario').reset();
    }

    // Ação simples para itens da tabela
    function detalhar(item) {
      alert(`Exibindo detalhes para: ${item}`);
    }
  </script>
</body>
</html>
